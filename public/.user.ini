; Raises PHP's default upload limits so the admin product video upload
; (validated up to 20MB in ProductController) isn't silently rejected by a
; lower shared-hosting default. Most PHP-FPM/CGI shared hosts (including
; Hostinger) pick up a .user.ini placed next to the entry script.
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
