name: Deploy to Hostinger

# Adjust this branch list once your git flow settles (e.g. just "main").
on:
  push:
    branches:
      - main
      - claude/bold-hawking-ptm14i
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, openssl, tokenizer, ctype, json, fileinfo, curl
          tools: composer
          coverage: none

      - name: Install PHP dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build deploy/ (merge public/ up, patch index.php, harden vendor/)
        run: |
          set -e
          rm -rf deploy
          mkdir deploy

          # Copy everything except VCS/dev-only paths and anything that must
          # never leave the CI runner (.env is never present here anyway).
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='scripts' \
            --exclude='tests' \
            --exclude='prototype' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.styleci.yml' \
            --exclude='.phpunit.result.cache' \
            --exclude='phpunit.xml' \
            ./ deploy/

          # Merge public/*'s contents up to the deploy root (this becomes
          # public_html) and drop the now-empty public/ directory.
          rsync -a deploy/public/ deploy/
          rm -rf deploy/public

          # index.php now lives next to vendor/, bootstrap/ and storage/
          # instead of one level above them.
          sed -i "s#__DIR__.'/../vendor/autoload.php'#__DIR__.'/vendor/autoload.php'#" deploy/index.php
          sed -i "s#__DIR__.'/../bootstrap/app.php'#__DIR__.'/bootstrap/app.php'#" deploy/index.php
          sed -i "s#__DIR__.'/../storage/framework/maintenance.php'#__DIR__.'/storage/framework/maintenance.php'#" deploy/index.php

          # vendor/ isn't in git, so it needs its own deny-all .htaccess too.
          cp storage/.htaccess deploy/vendor/.htaccess

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Guard against a missing/malformed target path
        run: |
          set -e
          TARGET_PATH="${{ vars.HOSTINGER_TARGET_PATH }}"
          if [ -z "$TARGET_PATH" ]; then
            echo "::error::HOSTINGER_TARGET_PATH is empty. It must be set as a repository VARIABLE (Settings → Secrets and variables → Actions → Variables tab), not a Secret. Refusing to run rsync --delete against an unset path — that would target the SSH account's home directory root instead of public_html." >&2
            exit 1
          fi
          case "$TARGET_PATH" in
            /*) ;;
            *)
              echo "::error::HOSTINGER_TARGET_PATH ('$TARGET_PATH') must be an absolute path (starting with /). Refusing to deploy." >&2
              exit 1
              ;;
          esac

      # Observed pattern across many runs today: whichever SSH connection
      # goes FIRST in a run always succeeds; a second one opened right
      # after always fails instantly (exit 255, no output) -- Hostinger's
      # SSH security layer (Imunify360/CSF-style) appears to allow only one
      # new connection per deploy right now. Rather than fight that, do the
      # whole deploy (file transfer + directory bootstrap + APP_KEY +
      # cache clear) inside that single connection: pipe a tar of deploy/
      # over stdin and run remote-setup.sh (passed inline, base64-encoded,
      # so stdin is free for the tar stream) in the same remote command.
      #
      # Note: unlike the previous rsync --delete step, this doesn't prune
      # files removed from the repo between deploys -- acceptable for now
      # to get past the SSH restriction; revisit once the site is live.
      - name: Deploy + bootstrap over a single SSH connection
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          TARGET_PATH: ${{ vars.HOSTINGER_TARGET_PATH }}
        run: |
          set -e
          tar czf deploy.tar.gz -C deploy .
          REMOTE_SETUP_B64=$(base64 -w0 scripts/remote-setup.sh)
          REMOTE_CMD="set -e; mkdir -p '$TARGET_PATH'; cd '$TARGET_PATH'; tar xzf -; echo $REMOTE_SETUP_B64 | base64 -d | bash -s -- '$TARGET_PATH'"
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "$REMOTE_CMD" < deploy.tar.gz
